<style>
:root {
  --primary: #E5484D; --primary-press: #C93A3F; --on-primary: #fff;
  --bg: #F7F2F1; --surface: #fff; --surface2: #F1E9E8; --on: #1F1A1B; --muted: #6E6566;
  --outline: #E6DADA; --table: #EDE3E2; --tonal: #FBE3E3; --on-tonal: #C93A3F;
  --ok: #2EA866; --warn: #E89B2C;
  --r: 22px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --primary: #F2666B; --primary-press: #D94F55;
    --bg: #141213; --surface: #201C1D; --surface2: #2A2526; --on: #F3EDED; --muted: #A89E9E;
    --outline: #3C3536; --table: #0D0B0C; --tonal: #3A2627; --on-tonal: #FFD9DA;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--on);
  font: 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
svg.i { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Kopf */
header { display: flex; align-items: center; gap: 8px; padding: 8px 6px 8px 14px; }
header img { width: 34px; height: 34px; border-radius: 9px; }
header h1 { font-size: 20px; font-weight: 600; margin: 0 0 0 4px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { display: flex; align-items: center; gap: 7px; background: var(--surface2); border-radius: 16px;
  padding: 6px 12px 6px 10px; font-size: 13px; font-weight: 600; max-width: 46vw; white-space: nowrap; }
.chip span { overflow: hidden; text-overflow: ellipsis; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.icon-btn { width: 42px; height: 42px; border-radius: 21px; display: grid; place-items: center; }
.icon-btn:active { background: var(--surface2); }
.lang { border: 1.5px solid var(--outline); border-radius: 14px; padding: 4px 9px; font-size: 13px; font-weight: 700; letter-spacing: .5px; }
.lang:active { background: var(--surface2); }
@media (max-width: 430px) { header h1 { visibility: hidden; } }

/* Vorschau */
#preview { position: relative; flex: 1 1 0; min-height: 120px; margin: 0 12px; background: var(--table);
  border-radius: var(--r); overflow: hidden; }
#paperScroll { position: absolute; inset: 0; overflow-y: auto; display: flex; justify-content: center; padding: 16px 0 44px; }
#paper { width: min(320px, calc(100% - 40px)); height: auto; align-self: flex-start; background: #fff;
  image-rendering: pixelated; image-rendering: crisp-edges; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
#empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 15px; text-align: center; padding: 20px; }
#len { position: absolute; right: 10px; bottom: 10px; background: var(--surface); border-radius: 12px; padding: 5px 10px; font-size: 12px; font-weight: 600; }

/* Bedienung */
.seg { display: flex; background: var(--surface2); border-radius: 22px; padding: 3px; }
.seg button { flex: 1; padding: 9px 6px; border-radius: 19px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.seg button.on { background: var(--primary); color: var(--on-primary); }
#tabs { margin: 10px 12px 2px; }
#controls { flex: 1.15 1 0; overflow-y: auto; padding: 4px 14px 16px; }
.panel { display: none; } .panel.on { display: block; }
.mt { margin-top: 10px; } .mt2 { margin-top: 6px; }
.row { display: flex; gap: 8px; align-items: center; }
.row > .grow { flex: 1; }
.tonal { display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--tonal); color: var(--on-tonal);
  border-radius: 22px; padding: 10px 12px; font-size: 14px; font-weight: 600; flex: 1; white-space: nowrap; }
.toggle { border: 1.5px solid var(--outline); border-radius: 18px; padding: 8px 14px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.toggle.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.slider { margin-top: 8px; }
.slider .head { display: flex; justify-content: space-between; font-size: 14px; padding: 0 2px; }
.slider .head b { font-weight: 400; color: var(--muted); }
input[type=range] { width: 100%; accent-color: var(--primary); margin: 6px 0 0; }
textarea, input[type=text] { width: 100%; font: inherit; color: var(--on); background: var(--surface2);
  border: 1px solid var(--outline); border-radius: 12px; padding: 10px 12px; outline: none; }
textarea { min-height: 84px; resize: vertical; }
textarea:focus, input[type=text]:focus { border-color: var(--primary); }
::placeholder { color: var(--muted); }
.drop { display: grid; place-items: center; text-align: center; gap: 6px; border: 2px dashed var(--outline);
  border-radius: 16px; padding: 22px 12px; margin-top: 10px; cursor: pointer; }
.drop svg { width: 40px; height: 40px; color: var(--primary); }
.drop b { font-size: 17px; } .drop small { color: var(--muted); font-size: 13px; }
.hint { color: var(--muted); font-size: 13px; margin-top: 8px; }

/* Druckleiste */
#bar { margin: 0 8px calc(8px + env(safe-area-inset-bottom)); background: var(--surface); border-radius: 24px;
  padding: 12px 14px 14px; box-shadow: 0 -2px 16px rgba(0,0,0,.12); }
#bar .label { color: var(--muted); font-size: 14px; font-weight: 600; padding: 0 10px 0 2px; }
.stepper { display: flex; align-items: center; background: var(--surface2); border-radius: 26px; padding: 2px; }
.stepper span { width: 34px; text-align: center; font-weight: 600; }
#print { position: relative; flex: 1; height: 54px; border-radius: 28px; overflow: hidden; color: var(--on-primary);
  font-size: 17px; font-weight: 600; background: color-mix(in srgb, var(--primary) 45%, transparent); }
#print .fill { position: absolute; inset: 0; background: var(--primary); transform-origin: left; transform: scaleX(1); transition: transform .15s; }
#print .lbl { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; }
#print:active .fill { background: var(--primary-press); }

/* Blaetter (Einstellungen, Verlauf) */
.sheet { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 10;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.sheet.on { display: flex; }
.sheet header h2 { font-size: 21px; margin: 0; font-weight: 600; }
.sheet .body { flex: 1; overflow-y: auto; padding: 0 16px 24px; }
.sec { color: var(--muted); font-size: 13px; font-weight: 600; margin: 14px 2px 6px; }
.card { background: var(--surface); border-radius: 18px; padding: 10px 14px 14px; }
.switch { display: flex; align-items: center; gap: 12px; padding: 10px 2px 6px; }
.switch > div { flex: 1; } .switch small { display: block; color: var(--muted); font-size: 13px; }
.switch input { width: 44px; height: 24px; accent-color: var(--primary); }
.hist { display: flex; gap: 14px; align-items: center; background: var(--surface); border-radius: 16px; padding: 10px 14px 10px 10px; margin-bottom: 10px; }
.hist canvas { width: 110px; height: 82px; object-fit: cover; object-position: top; background: #fff; padding: 3px; image-rendering: pixelated; }
.hist b { display: block; } .hist small { color: var(--muted); font-size: 14px; display: block; }
.hist .acts { display: flex; gap: 6px; margin-top: 6px; }
.hist .acts button { background: var(--tonal); color: var(--on-tonal); border-radius: 14px; padding: 5px 10px; font-size: 13px; font-weight: 600; }

/* Zuschneiden */
#crop { background: #000; color: #fff; }
#cropArea { flex: 1; position: relative; touch-action: none; }
#cropCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* Hinweis-Toast */
#toast { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%); background: var(--on); color: var(--bg);
  padding: 10px 16px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; max-width: 90vw; text-align: center; }
#toast.on { opacity: 1; }
#nobt { display: none; background: var(--tonal); color: var(--on-tonal); margin: 0 12px 8px; padding: 10px 14px; border-radius: 14px; font-size: 14px; }

/* Breite Bildschirme: links grosse Vorschau, rechts Bedienspalte; insgesamt begrenzt und zentriert */
@media (min-width: 900px) {
  body {
    display: grid; max-width: 1200px; margin: 0 auto; width: 100%;
    grid-template-columns: minmax(0, 1fr) 420px;
    grid-template-rows: auto auto auto minmax(0, 1fr) auto;
    grid-template-areas: "head head" "note note" "preview tabs" "preview controls" "preview bar";
    column-gap: 16px; padding-bottom: 16px;
  }
  header { grid-area: head; padding: 14px 6px 12px 16px; }
  #nobt { grid-area: note; }
  #preview { grid-area: preview; margin: 0 0 0 16px; min-height: 0; }
  #paper { width: min(384px, calc(100% - 48px)); }
  #tabs { grid-area: tabs; margin: 0 16px 2px 0; }
  #controls { grid-area: controls; padding: 4px 16px 12px 2px; }
  #bar { grid-area: bar; margin: 0 16px 0 0; }
  .sheet .body { width: 100%; max-width: 640px; margin: 0 auto; }
  .sheet > header { width: 100%; max-width: 672px; margin: 0 auto; }
  #toast { bottom: 40px; }
}
</style>
</head>

 * Aufbau nach ISO/IEC 18004. Struktur und Rechenschritte folgen der
 * "QR Code generator library" von Project Nayuki:

 *   out of or in connection with the Software or the use or other dealings in the
 *   Software.

const QR = (() => {
  const ECC = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28];
  const NB = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21];

  const rawMods = v => {
    let r = (16 * v + 128) * v + 64;
    if (v >= 2) { const na = Math.floor(v / 7) + 2; r -= (25 * na - 10) * na - 55; if (v >= 7) r -= 36; }
    return r;
  };
  const dataCw = v => Math.floor(rawMods(v) / 8) - ECC[v] * NB[v];
  const mul = (x, y) => {
    let z = 0;
    for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; }
    return z & 0xFF;
  };
  const rsDiv = d => {
    const r = new Array(d).fill(0); r[d - 1] = 1; let root = 1;
    for (let i = 0; i < d; i++) {
      for (let j = 0; j < d; j++) { r[j] = mul(r[j], root); if (j + 1 < d) r[j] ^= r[j + 1]; }
      root = mul(root, 2);
    }
    return r;
  };
  const rsRem = (data, div) => {
    const r = new Array(div.length).fill(0);
    for (const b of data) {
      const f = b ^ r.shift(); r.push(0);
      for (let i = 0; i < r.length; i++) r[i] ^= mul(div[i], f);
    }
    return r;
  };
  const bit = (x, i) => ((x >>> i) & 1) !== 0;

  function encode(text) {
    const data = [...new TextEncoder().encode(text)];
    let ver = 0;
    for (let v = 1; v <= 25; v++) if (4 + (v <= 9 ? 8 : 16) + data.length * 8 <= dataCw(v) * 8) { ver = v; break; }
    if (!ver) throw new Error('Text zu lang für einen QR-Code');
    const size = ver * 4 + 17;
    const mod = Array.from({ length: size }, () => new Array(size).fill(false));
    const fn = Array.from({ length: size }, () => new Array(size).fill(false));
    const setFn = (x, y, d) => { mod[y][x] = d; fn[y][x] = true; };

    // Datenbits
    const bits = [];
    const add = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    add(4, 4); add(data.length, ver <= 9 ? 8 : 16); data.forEach(b => add(b, 8));
    const cap = dataCw(ver) * 8;
    add(0, Math.min(4, cap - bits.length)); add(0, (8 - bits.length % 8) % 8);
    for (let p = 0xEC; bits.length < cap; p ^= 0xEC ^ 0x11) add(p, 8);
    const cw = [];
    for (let i = 0; i < bits.length; i += 8) { let b = 0; for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j]; cw.push(b); }

    // Funktionsmuster
    for (let i = 0; i < size; i++) { setFn(6, i, i % 2 === 0); setFn(i, 6, i % 2 === 0); }
    const finder = (x, y) => {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const d = Math.max(Math.abs(dx), Math.abs(dy)), xx = x + dx, yy = y + dy;
        if (xx >= 0 && xx < size && yy >= 0 && yy < size) setFn(xx, yy, d !== 2 && d !== 4);
      }
    };
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
    let pos = [];
    if (ver > 1) {
      const num = Math.floor(ver / 7) + 2, step = Math.floor((ver * 4 + num * 2 + 1) / (num * 2 - 2)) * 2;
      pos = new Array(num); pos[0] = 6;
      for (let i = num - 1, p = size - 7; i >= 1; i--, p -= step) pos[i] = p;
    }
    const n = pos.length;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++)
      if (!(i === 0 && j === 0 || i === 0 && j === n - 1 || i === n - 1 && j === 0))
        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++)
          setFn(pos[i] + dx, pos[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    const fmt = mask => {
      let rem = mask;
      for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      const b = ((mask << 10) | rem) ^ 0x5412;   // ECC-Level M = 00
      for (let i = 0; i <= 5; i++) setFn(8, i, bit(b, i));
      setFn(8, 7, bit(b, 6)); setFn(8, 8, bit(b, 7)); setFn(7, 8, bit(b, 8));
      for (let i = 9; i < 15; i++) setFn(14 - i, 8, bit(b, i));
      for (let i = 0; i < 8; i++) setFn(size - 1 - i, 8, bit(b, i));
      for (let i = 8; i < 15; i++) setFn(8, size - 15 + i, bit(b, i));
      setFn(8, size - 8, true);
    };
    fmt(0);
    if (ver >= 7) {
      let rem = ver;
      for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
      const b = (ver << 12) | rem;
      for (let i = 0; i < 18; i++) { const v = bit(b, i), a = size - 11 + i % 3, c = Math.floor(i / 3); setFn(a, c, v); setFn(c, a, v); }
    }

    // Fehlerkorrektur + Verschachtelung
    const nb = NB[ver], el = ECC[ver], raw = Math.floor(rawMods(ver) / 8), ns = nb - raw % nb, sl = Math.floor(raw / nb);
    const div = rsDiv(el), blocks = [];
    for (let i = 0, k = 0; i < nb; i++) {
      const dl = sl - el + (i < ns ? 0 : 1);
      const dat = cw.slice(k, k + dl); k += dl;
      const ecc = rsRem(dat, div);
      if (i < ns) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    const all = [];
    for (let i = 0; i < blocks[0].length; i++) for (let j = 0; j < nb; j++) if (i !== sl - el || j >= ns) all.push(blocks[j][i]);

    // Codewoerter platzieren
    let idx = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++) {
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
        if (!fn[y][x] && idx < all.length * 8) { mod[y][x] = bit(all[idx >>> 3], 7 - (idx & 7)); idx++; }
      }
    }

    const masks = [
      (x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x, y) => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => x * y % 2 + x * y % 3 === 0,
      (x, y) => (x * y % 2 + x * y % 3) % 2 === 0, (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0];
    const apply = m => { for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!fn[y][x] && masks[m](x, y)) mod[y][x] = !mod[y][x]; };
    const penalty = () => {
      let p = 0, dark = 0;
      for (let y = 0; y < size; y++) { let run = 1; for (let x = 1; x < size; x++) { if (mod[y][x] === mod[y][x - 1]) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1; } }
      for (let x = 0; x < size; x++) { let run = 1; for (let y = 1; y < size; y++) { if (mod[y][x] === mod[y - 1][x]) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1; } }
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
        if (mod[y][x]) dark++;
        if (x && y) { const c = mod[y][x]; if (c === mod[y][x - 1] && c === mod[y - 1][x] && c === mod[y - 1][x - 1]) p += 3; }
      }
      const total = size * size, k = Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1;
      return p + Math.max(0, k) * 10;
    };
    let best = 0, min = Infinity;
    for (let m = 0; m < 8; m++) { apply(m); fmt(m); const p = penalty(); if (p < min) { min = p; best = m; } apply(m); }
    apply(best); fmt(best);
    return { size, get: (x, y) => mod[y][x] };
  }
  return { encode };
})();
if (typeof module !== 'undefined') module.exports = QR;

</script>

  text: (t, size, fam, bold, align) => stack([textBlock(t || ' ', size, bold, ['left', 'center', 'right'][align], fam)], 0),
  checklist(title, items, withDate) {
    const bl = [];
    if (title.trim()) bl.push(textBlock(title.trim(), 36, true));
    if (withDate) bl.push(textBlock(nowStr(), 20, false));
    if (bl.length) bl.push(rule(3));
    for (const raw of items.split('\n')) {
      const it = raw.trim(); if (!it) continue;
      const tb = textBlock(it, 28, false, 'left', 0, 46);
      bl.push({ h: Math.max(34, tb.h), draw(g, y) {
        g.lineWidth = 3; g.strokeStyle = '#000';
        g.beginPath(); g.roundRect ? g.roundRect(M + 2, y + 3, 26, 26, 4) : g.rect(M + 2, y + 3, 26, 26); g.stroke();
        tb.draw(g, y);
      } });
    }
    if (!bl.length) bl.push(textBlock(T('tplListEmpty'), 26, false));
    return stack(bl, 12);
  },
  qr(content, caption, sizeLevel) {
    if (!content.trim()) return stack([textBlock(T('tplQrEmpty'), 26, false, 'center')], 0);
    let q; try { q = QR.encode(content.trim()); } catch { throw new Error(T('qrTooLong')); }
    const maxPx = Math.floor((W - 2 * M) * [0.5, 0.75, 1][sizeLevel]);
    const mod = Math.max(1, Math.floor(maxPx / q.size)), px = mod * q.size;
    const bl = [{ h: px, draw(g, y) {
      g.fillStyle = '#000'; const x0 = Math.floor((W - px) / 2);
      for (let yy = 0; yy < q.size; yy++) for (let xx = 0; xx < q.size; xx++) if (q.get(xx, yy)) g.fillRect(x0 + xx * mod, y + yy * mod, mod, mod);
    } }];
    if (caption.trim()) bl.push(textBlock(caption.trim(), 26, true, 'center'));
    return stack(bl, 14);
  },
  banner(s, bold) {
    s = (s.trim() || T('tplBannerDefault')).replace(/\n/g, ' ');
    const size = Math.floor((W - 24) / 1.18);
    measureCtx.font = fontStr(size, bold);
    const len = Math.ceil(measureCtx.measureText(s).width) + 40;
    const c = canvas(W, len), g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, W, len);
    g.translate(W, 0); g.rotate(Math.PI / 2);   // Text laeuft entlang des Streifens
    g.fillStyle = '#000'; g.font = fontStr(size, bold); g.textBaseline = 'middle';
    g.fillText(s, 20, W / 2);
    return c;
  },
  note(title, body, withDate, frame) {
    const ind = frame ? 14 : 0, bl = [];
    if (withDate) bl.push(textBlock(nowStr(), 20, false, 'left', 0, ind));
    if (title.trim()) bl.push(textBlock(title.trim(), 34, true, 'left', 0, ind));
    if (body.trim()) bl.push(textBlock(body.trim(), 27, false, 'left', 0, ind));
    if (!bl.length) bl.push(textBlock(T('tplNoteEmpty'), 26, false, 'left', 0, ind));
    const inner = stack(bl, 10);
    if (!frame) return inner;
    const pad = 14, c = canvas(W, inner.height + 2 * pad), g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, W, c.height); g.drawImage(inner, -ind / 2, pad);
    g.lineWidth = 4; g.strokeStyle = '#000'; g.beginPath();
    g.roundRect ? g.roundRect(4, 4, W - 8, c.height - 8, 18) : g.rect(4, 4, W - 8, c.height - 8); g.stroke();
    return c;
  }
};

// ================================================================ Laden (Bild/PDF)
async function loadImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error(T('imageError'))); i.src = url; });
    const max = 1600, s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = canvas(Math.round(img.naturalWidth * s), Math.round(img.naturalHeight * s)), g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    return c;
  } finally { URL.revokeObjectURL(url); }
}
let pdfjsReady;
function loadPdfJs() {
  if (!pdfjsReady) pdfjsReady = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; res(); };
    s.onerror = () => { pdfjsReady = null; rej(new Error(T('pdfLoadError'))); };
    document.head.appendChild(s);
  });
  return pdfjsReady;
}
async function loadPdf(file) {
  await loadPdfJs();
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const parts = [];
  for (let p = 1; p <= Math.min(pdf.numPages, 30); p++) {
    const page = await pdf.getPage(p), vp0 = page.getViewport({ scale: 1 }), vp = page.getViewport({ scale: 1240 / vp0.width });
    const c = canvas(Math.round(vp.width), Math.round(vp.height)), g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: g, viewport: vp }).promise;
    const t = trim(c); if (t) parts.push(toWidth(t));
  }
  if (!parts.length) throw new Error(T('pdfEmpty'));
  const gap = 16, out = canvas(W, parts.reduce((s, p) => s + p.height, 0) + gap * (parts.length - 1)), g = out.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, out.height);
  let y = 0; for (const p of parts) { g.drawImage(p, 0, y); y += p.height + gap; }
  return out;
}

// ================================================================ UI-Bausteine
function seg(id, sel, onPick) {
  const el = $(id), btns = [...el.children];
  const api = { value: sel, set(i, notify) { api.value = i; btns.forEach((b, k) => b.classList.toggle('on', k === i)); if (notify && onPick) onPick(i); } };
  btns.forEach((b, i) => b.onclick = () => api.set(i, true));
  api.set(sel, false);
  return api;
}
function toggle(id, on, onChange) {
  const el = $(id);
  const api = { on, set(v, notify) { api.on = v; el.classList.toggle('on', v); if (notify && onChange) onChange(); } };
  el.onclick = () => api.set(!api.on, true);
  api.set(on, false);
  return api;
}
function slider(id, val, fmt, onInput) {
  const el = $(id), lab = $(id + 'V');
  el.value = val; lab.textContent = fmt(+el.value);
  el.oninput = () => { lab.textContent = fmt(+el.value); onInput && onInput(); };
  return { get value() { return +el.value; }, set value(v) { el.value = v; lab.textContent = fmt(+v); } };
}
let toastT;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), Math.max(2600, msg.length * 70)); }
const fmtCm = v => (v / 80).toLocaleString(LOCALE(), { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' cm';

// ================================================================ Zustand
const S = {
  source: null, kind: 'bild', rotation: 0, crop: null, result: null, resultKind: 'text', busy: false, copies: 1, gen: 0

const PRESETS = [[75, 9000], [100, 12000], [140, 16000]];

const tabs = seg('tabs', store.get('tab', 1), () => { showPanels(); render(); });

const autoL = toggle('autoB', store.get('autoLevels', true), () => render());
const inv = toggle('invB', false, () => render());
const br = slider('br', 100, v => v + ' %', () => renderLater());

const sz = slider('sz', store.get('size', 40), v => String(v), () => renderLater());
const font = seg('font', store.get('font', 0), () => render());
const bold = toggle('boldB', store.get('bold', false), () => render());
const align = seg('align', store.get('align', 0), () => render());
const tpl = seg('tpl', store.get('tpl', 0), () => { showTpl(); render(); });
const qrSize = seg('qrSize', store.get('qrSize', 1), () => render());
const clDate = toggle('clDate', store.get('clDate', true), () => render());
const bnBold = toggle('bnBold', store.get('bnBold', true), () => render());
const ntDate = toggle('ntDate', store.get('ntDate', true), () => render());

const tune = slider('tune', store.get('tune', 0), v => (v > 0 ? '+' : '') + v + ' %', () => store.set('tune', tune.value));
const feed = slider('feed', store.get('feed', 80), fmtCm, () => store.set('feed', feed.value));
const safe = toggle('safeB', store.get('safeMode', IS_APPLE), () => store.set('safeMode', safe.on));
const fields = { txt: T('defText'), clTitle: T('defListTitle'), clItems: T('defListItems'), qrText: '', qrCap: '', bnText: T('defBanner'), ntTitle: '', ntBody: '' };
for (const [id, def] of Object.entries(fields)) { $(id).value = store.get(id, def); $(id).addEventListener('input', () => { store.set(id, $(id).value); renderLater(); }); }

function saveState() {
  store.set('tab', tabs.value); store.set('imgMode', imgMode.value); store.set('autoLevels', autoL.on);
  store.set('size', sz.value); store.set('font', font.value); store.set('bold', bold.on); store.set('align', align.value);
  store.set('tpl', tpl.value); store.set('qrSize', qrSize.value); store.set('clDate', clDate.on);
  store.set('bnBold', bnBold.on); store.set('ntDate', ntDate.on); store.set('ntFrame', ntFrame.on);
}
['click', 'input', 'change'].forEach(ev => document.addEventListener(ev, () => setTimeout(saveState, 0)));

function showPanels() { ['pImg', 'pText', 'pTpl'].forEach((p, i) => $(p).classList.toggle('on', i === tabs.value)); }
function showTpl() { document.querySelectorAll('.sub').forEach(s => s.hidden = +s.dataset.t !== tpl.value); }

// ================================================================ Rendern
let renderT;
function renderLater() { clearTimeout(renderT); renderT = setTimeout(render, 160); }
function render() {
  clearTimeout(renderT);
  const gen = ++S.gen;
  let src, opts, kind;
  try {
    if (tabs.value === 0) {
      if (!S.source) return show(null, T('noImage'));
      src = cropTo(rotate(S.source, S.rotation), S.crop);
      opts = { dither: imgMode.value === 0, invert: inv.on, auto: autoL.on && S.kind !== 'verlauf', bright: br.value / 100, contrast: co.value / 100, threshold: 160 };
      kind = 'bild';
    } else if (tabs.value === 1) {
      src = Tpl.text($('txt').value, sz.value, font.value, bold.on, align.value);
      opts = { threshold: 160 }; kind = 'text';
    } else {
      const t = tpl.value;
      src = t === 0 ? Tpl.checklist($('clTitle').value, $('clItems').value, clDate.on)
        : t === 1 ? Tpl.qr($('qrText').value, $('qrCap').value, qrSize.value)
        : t === 2 ? Tpl.banner($('bnText').value, bnBold.on)
        : Tpl.note($('ntTitle').value, $('ntBody').value, ntDate.on, ntFrame.on);
      opts = { threshold: 150 }; kind = TPL_KIND[t];
    }
    const r = process(src, opts);
    if (gen === S.gen) show(r, null, kind);

}
function show(r, msg, kind) {

  paper.style.visibility = 'visible'; $('empty').hidden = true; $('len').hidden = false; $('len').textContent = fmtCm(r.h);
  if (S.pendingPrint) { S.pendingPrint = false; doPrint(); }
}

// ================================================================ Drucken
function strengthValues() {
  const [d, e] = PRESETS[strength.value], f = 1 + tune.value / 100;
  return [Math.max(30, Math.min(200, Math.round(d * f))), Math.max(3000, Math.min(20000, Math.round(e * f)))];
}
function setPrintUi(label, frac) { $('printLbl').textContent = label; $('fill').style.transform = `scaleX(${frac})`; }
async function doPrint() {
  if (S.busy) return;
  if (!S.result) return toast(T('nothingToPrint'));
  if (!navigator.bluetooth) return toast(T('noBtHint'));
  S.busy = true;
  const r = S.result, kind = S.resultKind, [dens, en] = strengthValues();
  const job = buildJob(r.packed, r.h, en, dens, feed.value);
  setPrintUi(T('connecting'), 0);
  try {
    await Printer.send(job, S.copies, f => setPrintUi(T('printingPct', Math.round(f * 100)), f));
    History.add(r, kind);
    toast(S.copies > 1 ? T('printedN', S.copies) : T('printed'));
  } catch (e) {
    if (e.name !== 'NotFoundError') toast(T('printFailed', e.message || e));
  } finally { S.busy = false; setPrintUi(T('print'), 1); }
}

// ================================================================ Verlauf (gepackte Bits im localStorage)
const History = {
  list() { return store.get('history', []); },
  add(r, kind) {
    let bin = ''; for (const b of r.packed) bin += String.fromCharCode(b);
    const l = this.list(); l.unshift({ t: Date.now(), kind, h: r.h, bits: btoa(bin) });
    while (l.length) { try { localStorage.setItem('pd01.history', JSON.stringify(l.slice(0, 20))); break; } catch { l.pop(); if (!l.length) break; } }
  },
  decode(e) { const s = atob(e.bits), p = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) p[i] = s.charCodeAt(i); return p; },
  remove(t) { store.set('history', this.list().filter(e => e.t !== t)); }
};
const kindLabel = k => T('kind_' + (I18N.de['kind_' + k] ? k : ''));
function openHistory() {
  const box = $('histList'); box.innerHTML = '';
  const l = History.list();
  if (!l.length) box.innerHTML = '<p class="hint" style="text-align:center;margin-top:60px">' + T('histEmpty') + '</p>';
  for (const e of l) {
    const packed = History.decode(e), img = unpack(packed, e.h);
    const c = canvas(W, e.h); c.getContext('2d').putImageData(img, 0, 0);
    const item = document.createElement('div'); item.className = 'hist';
    item.appendChild(c);
    const info = document.createElement('div');
    info.innerHTML = `<b>${kindLabel(e.kind)}</b><small>${new Date(e.t).toLocaleString(LOCALE(), { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })} · ${fmtCm(e.h)}</small>
      <div class="acts"><button data-a="print">${T('printAgain')}</button><button data-a="open">${T('open')}</button><button data-a="del">${T('delete')}</button></div>`;
    item.appendChild(info);
    info.querySelector('[data-a=print]').onclick = () => { useHistory(c); closeSheets(); S.pendingPrint = true; render(); };
    info.querySelector('[data-a=open]').onclick = () => { useHistory(c); closeSheets(); render(); };
    info.querySelector('[data-a=del]').onclick = () => { History.remove(e.t); openHistory(); };
    box.appendChild(item);
  }
  $('history').classList.add('on');
}
function useHistory(c) {
  setSource(c, 'verlauf'); imgMode.set(1, false);
}

// ================================================================ Quellen
function setSource(c, kind) {
  S.source = c; S.kind = kind; S.rotation = 0; S.crop = null;
  inv.set(false, false); br.value = 100; co.value = 100;
  tabs.set(0, false); showPanels(); updateImgPanel();
}
$('file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  $('empty').textContent = T('loading'); $('empty').hidden = false;
  try {
    const pdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
    const c = pdf ? await loadPdf(f) : await loadImage(f);
    setSource(c, pdf ? 'pdf' : 'bild');
    if (pdf) imgMode.set(1, false);
    render();
  } catch (err) { toast(err.message); render(); }
};
$('pickB').onclick = () => $('file').click();
$('rotB').onclick = () => { S.rotation = (S.rotation + 90) % 360; S.crop = null; render(); };

// ================================================================ Zuschneiden
const Crop = {
  open() {
    if (!S.source) return;
    this.img = rotate(S.source, S.rotation);
    this.rel = S.crop ? [...S.crop] : [0, 0, 1, 1];
    $('crop').classList.add('on');
    requestAnimationFrame(() => this.layout());
  },
  layout() {
    const cv = $('cropCanvas'), r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
    cv.width = r.width * dpr; cv.height = r.height * dpr; this.dpr = dpr;
    const pad = 24 * dpr, s = Math.min((cv.width - 2 * pad) / this.img.width, (cv.height - 2 * pad) / this.img.height);
    const w = this.img.width * s, h = this.img.height * s;
    this.box = { x: (cv.width - w) / 2, y: (cv.height - h) / 2, w, h };
    this.draw();
  },
  sel() { const b = this.box, r = this.rel; return { l: b.x + r[0] * b.w, t: b.y + r[1] * b.h, r: b.x + r[2] * b.w, b: b.y + r[3] * b.h }; },
  draw() {
    const cv = $('cropCanvas'), g = cv.getContext('2d'), b = this.box, s = this.sel(), d = this.dpr;
    g.clearRect(0, 0, cv.width, cv.height);
    g.drawImage(this.img, b.x, b.y, b.w, b.h);
    g.fillStyle = 'rgba(0,0,0,.65)';
    g.fillRect(b.x, b.y, b.w, s.t - b.y); g.fillRect(b.x, s.b, b.w, b.y + b.h - s.b);
    g.fillRect(b.x, s.t, s.l - b.x, s.b - s.t); g.fillRect(s.r, s.t, b.x + b.w - s.r, s.b - s.t);
    g.strokeStyle = 'rgba(255,255,255,.4)'; g.lineWidth = d;
    for (let i = 1; i < 3; i++) {
      const x = s.l + (s.r - s.l) * i / 3, y = s.t + (s.b - s.t) * i / 3;
      g.beginPath(); g.moveTo(x, s.t); g.lineTo(x, s.b); g.moveTo(s.l, y); g.lineTo(s.r, y); g.stroke();
    }
    g.strokeStyle = '#fff'; g.lineWidth = 2 * d; g.strokeRect(s.l, s.t, s.r - s.l, s.b - s.t);
    const L = Math.min(28 * d, (s.r - s.l) / 3, (s.b - s.t) / 3);
    g.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--primary'); g.lineWidth = 5 * d; g.lineCap = 'round';
    g.beginPath();

    g.moveTo(s.r - L, s.t); g.lineTo(s.r, s.t); g.lineTo(s.r, s.t + L);
    g.moveTo(s.r, s.b - L); g.lineTo(s.r, s.b); g.lineTo(s.r - L, s.b);
    g.moveTo(s.l + L, s.b); g.lineTo(s.l, s.b); g.lineTo(s.l, s.b - L);
    g.stroke();
  },
  down(e) {
    const d = this.dpr, x = e.offsetX * d, y = e.offsetY * d, s = this.sel(), T = 28 * d;
    const inY = y > s.t - T && y < s.b + T, inX = x > s.l - T && x < s.r + T;
    this.mode = (inY && Math.abs(x - s.l) < T ? 1 : 0) | (inX && Math.abs(y - s.t) < T ? 2 : 0) | (inY && Math.abs(x - s.r) < T ? 4 : 0) | (inX && Math.abs(y - s.b) < T ? 8 : 0);
    if (!this.mode && x > s.l && x < s.r && y > s.t && y < s.b) this.mode = 16;

    const d = this.dpr, x = e.offsetX * d, y = e.offsetY * d, b = this.box;
    const dx = (x - this.last[0]) / b.w, dy = (y - this.last[1]) / b.h, r = this.rel, min = 0.06;
    if (this.mode === 16) {
      const mx = Math.max(-r[0], Math.min(1 - r[2], dx)), my = Math.max(-r[1], Math.min(1 - r[3], dy));
      r[0] += mx; r[2] += mx; r[1] += my; r[3] += my;
    } else {
      if (this.mode & 1) r[0] = Math.max(0, Math.min(r[2] - min, r[0] + dx));
      if (this.mode & 4) r[2] = Math.min(1, Math.max(r[0] + min, r[2] + dx));
      if (this.mode & 2) r[1] = Math.max(0, Math.min(r[3] - min, r[1] + dy));
      if (this.mode & 8) r[3] = Math.min(1, Math.max(r[1] + min, r[3] + dy));
    }
    this.last = [x, y]; this.draw();
  }
};
$('cropB').onclick = () => Crop.open();
const cc = $('cropCanvas');
cc.onpointerdown = e => Crop.down(e); cc.onpointermove = e => Crop.move(e); cc.onpointerup = cc.onpointercancel = () => Crop.mode = 0;
$('cropReset').onclick = () => { Crop.rel = [0, 0, 1, 1]; Crop.draw(); };
$('cropOk').onclick = () => {
  const r = Crop.rel, full = r[0] < .001 && r[1] < .001 && r[2] > .999 && r[3] > .999;
  S.crop = full ? null : [...r]; closeSheets(); render();
};
addEventListener('resize', () => { if ($('crop').classList.contains('on')) Crop.layout(); });

// ================================================================ Verbindung & Kopfzeile

Printer.listeners.push(updateChip);
async function connectUi() {
  try { await Printer.connect(); }
  catch (e) { if (e.name !== 'NotFoundError') toast(T('connectFailed', e.message || e)); }
}
$('chip').onclick = () => Printer.state === 'off' ? connectUi() : $('settings').classList.add('on');
$('connB').onclick = () => { Printer.forget(); connectUi(); };
$('discB').onclick = () => Printer.forget();
$('feedB').onclick = async () => {
  try { if (!Printer.tx) await Printer.connect(); await Printer.write(feedCmd(120)); toast(T('fed')); }
  catch (e) { if (e.name !== 'NotFoundError') toast(e.message || String(e)); }
};

// ================================================================ Blaetter, Leiste
function closeSheets() { document.querySelectorAll('.sheet').forEach(s => s.classList.remove('on')); }
document.querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheets);
$('setBtn').onclick = () => $('settings').classList.add('on');
$('histBtn').onclick = openHistory;
$('print').onclick = doPrint;
const setCopies = n => { S.copies = Math.max(1, Math.min(20, n)); $('copies').textContent = S.copies + '×'; };
$('minus').onclick = () => setCopies(S.copies - 1);
$('plus').onclick = () => setCopies(S.copies + 1);
// Tippen auf die Vorschau schliesst die Tastatur
$('preview').onclick = () => document.activeElement?.blur?.();

// ================================================================ Sprache umschalten
function setLang(l) {
  if (l === LANG) return;
  // unveraenderte Beispieltexte in die neue Sprache uebernehmen
  const ex = { txt: 'defText', clTitle: 'defListTitle', clItems: 'defListItems', bnText: 'defBanner' };
  for (const [id, key] of Object.entries(ex)) if ($(id).value === I18N[LANG][key]) { $(id).value = I18N[l][key]; store.set(id, $(id).value); }
  LANG = l; store.set('lang', l);
  applyLang(); langSeg.set(l === 'de' ? 0 : 1, false);
  feed.value = feed.value;   // Zahlenformat (Komma/Punkt) neu anzeigen
  updateChip(); if (!S.busy) setPrintUi(T('print'), 1);
  if ($('history').classList.contains('on')) openHistory();
  render();
}
$('langB').onclick = () => setLang(LANG === 'de' ? 'en' : 'de');
const langSeg = seg('langSeg', LANG === 'de' ? 0 : 1, i => setLang(i === 0 ? 'de' : 'en'));

// ================================================================ Start
applyLang(); setPrintUi(T('print'), 1);
if (!navigator.bluetooth) $('nobt').style.display = 'block';
showPanels(); showTpl(); updateImgPanel(); updateChip(); render();
</script>
</body>
</html>
